<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mencegah browser HP memaksakan invert/ubah warna tema secara sepihak -->
    <meta name="color-scheme" content="light only" />
    <title>Foregood Coffee & More — Katalog Produk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style.css?v=1.5" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brandrow">
        <div class="brandmark">
          <img
            src="logo_foregood.png"
            alt="Logo ForeGood Coffee"
            class="brand-logo-img"
          />
        </div>
        <div class="brandtext">
          <h1>Foregood Coffee &amp; More</h1>
          <p>Katalog menu</p>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m21 21-4.3-4.3"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Cari menu kopi, makanan..."
        />
      </div>
    </div>

    <nav class="pills" id="pillRow"></nav>

    <main class="grid-wrap">
      <div class="grid" id="grid"></div>
    </main>

    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet"></div>
    </div>

    <script src="script.js"></script>
    <script src="script.js?v=1.5"></script>
  </body>
</html>
