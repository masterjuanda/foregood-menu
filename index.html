<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foregood Coffee & More — Katalog Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="brandrow">
        <div class="brandmark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 8h13a3 3 0 0 1 0 6h-1"
              stroke="#5F6B45"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M4 8v6a5 5 0 0 0 5 5h3a5 5 0 0 0 5-5v-1"
              stroke="#5F6B45"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M8 5c.7 1 .7 2-.3 3M12 4c.7 1 .7 2-.3 3"
              stroke="#5F6B45"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div class="brandtext">
          <h1>Foregood Coffee &amp; More</h1>
          <p>Katalog menu</p>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m21 21-4.3-4.3"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Cari menu kopi, makanan..."
        />
      </div>
    </div>

    <nav class="pills" id="pillRow"></nav>

    <main class="grid-wrap">
      <div class="grid" id="grid"></div>
    </main>

    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
