<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foregood Coffee & More — Katalog Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --espresso: #2e1d14;
        --espresso-2: #4a3222;
        --cream: #f7f2ea;
        --cream-2: #fffdf9;
        --sage: #5f6b45;
        --sage-light: #ebeee1;
        --caramel: #b9793a;
        --text-muted: #8c7a68;
        --line: #e7dfd2;
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--cream);
        font-family: "Manrope", sans-serif;
        color: var(--espresso);
        -webkit-font-smoothing: antialiased;
        padding-bottom: 48px;
      }
      a {
        color: inherit;
      }

      /* ---------- Header ---------- */
      header.top {
        background: linear-gradient(
          160deg,
          var(--espresso) 0%,
          var(--espresso-2) 100%
        );
        color: var(--cream-2);
        padding: 34px 20px 40px;
        border-radius: 0 0 28px 28px;
      }
      .brandrow {
        display: flex;
        align-items: center;
        gap: 14px;
        max-width: 900px;
        margin: 0 auto;
      }
      .brandmark {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        background: var(--cream-2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
      }
      .brandmark svg {
        width: 28px;
        height: 28px;
      }
      .brandtext h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 1.5rem;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .brandtext p {
        margin: 2px 0 0;
        font-size: 0.85rem;
        color: #d8c9b8;
        font-weight: 500;
      }

      /* ---------- Search + filters ---------- */
      .controls {
        max-width: 900px;
        margin: -22px auto 0;
        padding: 0 20px;
      }
      .searchbar {
        background: var(--cream-2);
        border-radius: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 16px;
        box-shadow: 0 10px 24px rgba(46, 29, 20, 0.12);
        border: 1px solid var(--line);
      }
      .searchbar svg {
        flex-shrink: 0;
        color: var(--caramel);
      }
      .searchbar input {
        border: none;
        outline: none;
        background: transparent;
        font-family: "Manrope", sans-serif;
        font-size: 0.92rem;
        width: 100%;
        color: var(--espresso);
      }
      .searchbar input::placeholder {
        color: #b8a996;
      }

      .pills {
        display: flex;
        gap: 9px;
        overflow-x: auto;
        padding: 18px 20px 4px;
        max-width: 900px;
        margin: 0 auto;
        scrollbar-width: none;
      }
      .pills::-webkit-scrollbar {
        display: none;
      }
      .pill {
        flex-shrink: 0;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        background: var(--cream-2);
        border: 1px solid var(--line);
        color: var(--espresso-2);
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          border-color 0.15s ease;
        white-space: nowrap;
      }
      .pill.active {
        background: var(--espresso);
        border-color: var(--espresso);
        color: var(--cream-2);
      }

      /* ---------- Grid ---------- */
      .grid-wrap {
        max-width: 900px;
        margin: 8px auto 0;
        padding: 14px 20px 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
      }
      @media (min-width: 620px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 900px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .card {
        background: var(--cream-2);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
        display: flex;
        flex-direction: column;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 28px rgba(46, 29, 20, 0.14);
      }
      .card:focus-visible {
        outline: 2px solid var(--sage);
        outline-offset: 2px;
      }
      .card .imgwrap {
        position: relative;
        aspect-ratio: 1/1;
        background: var(--sage-light);
        overflow: hidden;
      }
      .card .imgwrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card .badge {
        display: inline-block;
        color: var(--sage);
        font-size: 0.68rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--sage-light);
      }
      .card .info {
        padding: 12px 13px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .card .info h3 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 1rem;
        margin: 0;
        line-height: 1.25;
        color: var(--espresso);
      }
      .card .meta-row {
        margin-top: auto;
        padding-top: 6px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .card .price {
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--caramel);
        white-space: nowrap;
      }

      /* ---------- Empty / loading states ---------- */
      .state-msg {
        grid-column: 1/-1;
        text-align: center;
        padding: 50px 20px;
        color: var(--text-muted);
      }
      .state-msg h3 {
        font-family: "Fraunces", serif;
        color: var(--espresso-2);
        margin: 10px 0 4px;
        font-size: 1.1rem;
      }
      .state-msg p {
        margin: 0;
        font-size: 0.88rem;
      }
      .skel {
        background: linear-gradient(
          100deg,
          var(--sage-light) 30%,
          #f3efe4 50%,
          var(--sage-light) 70%
        );
        background-size: 200% 100%;
        animation: shine 1.3s infinite;
      }
      @keyframes shine {
        from {
          background-position: 120% 0;
        }
        to {
          background-position: -20% 0;
        }
      }
      .skel-card .imgwrap {
        background: none;
      }

      /* ---------- Detail sheet ---------- */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(29, 18, 11, 0.45);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.22s ease;
        z-index: 50;
      }
      .overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .sheet {
        background: var(--cream-2);
        width: 100%;
        max-width: 520px;
        border-radius: 24px 24px 0 0;
        max-height: 88vh;
        overflow-y: auto;
        transform: translateY(30px);
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
      }
      .overlay.show .sheet {
        transform: translateY(0);
      }
      .sheet .grabber {
        width: 38px;
        height: 4px;
        border-radius: 99px;
        background: var(--line);
        margin: 12px auto 0;
      }
      .sheet .hero {
        width: 100%;
        aspect-ratio: 4/3;
        background: var(--sage-light);
        overflow: hidden;
        margin-top: 14px;
      }
      .sheet .hero img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .sheet .body {
        padding: 20px 22px 30px;
      }
      .sheet .tag {
        display: inline-block;
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--sage);
        background: var(--sage-light);
        padding: 5px 12px;
        border-radius: 999px;
        margin-bottom: 10px;
      }
      .sheet h2 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 1.55rem;
        margin: 0 0 6px;
        line-height: 1.2;
      }
      .sheet .price {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--caramel);
        margin-bottom: 14px;
      }
      .sheet .desc {
        font-size: 0.92rem;
        line-height: 1.65;
        color: var(--espresso-2);
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .sheet .desc.empty {
        color: var(--text-muted);
        font-style: italic;
      }
      .closebtn {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(46, 29, 20, 0.55);
        color: #fff;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .sheet-imgbox {
        position: relative;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="brandrow">
        <div class="brandmark">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 8h13a3 3 0 0 1 0 6h-1"
              stroke="#5F6B45"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M4 8v6a5 5 0 0 0 5 5h3a5 5 0 0 0 5-5v-1"
              stroke="#5F6B45"
              stroke-width="1.6"
              stroke-linecap="round"
            />
            <path
              d="M8 5c.7 1 .7 2-.3 3M12 4c.7 1 .7 2-.3 3"
              stroke="#5F6B45"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <div class="brandtext">
          <h1>Foregood Coffee &amp; More</h1>
          <p>Katalog menu</p>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="searchbar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle
            cx="11"
            cy="11"
            r="7"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="m21 21-4.3-4.3"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="Cari menu kopi, makanan..."
        />
      </div>
    </div>

    <nav class="pills" id="pillRow"></nav>

    <main class="grid-wrap">
      <div class="grid" id="grid"></div>
    </main>

    <div class="overlay" id="overlay">
      <div class="sheet" id="sheet"></div>
    </div>

    <script>
      // ====== ISI SESUAI PROJECT SUPABASE KAMU ======
      const SUPABASE_URL = "https://deyxmpihsiqrrzelsfsp.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_LpBuLa03qMWKqDqATTQXqg_eM3VQGwp";
      // ===============================================

      const supa = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      let allProducts = [];
      let categories = [];
      let activeCategory = "Semua";
      let searchQuery = "";

      const gridEl = document.getElementById("grid");
      const pillRowEl = document.getElementById("pillRow");
      const searchInput = document.getElementById("searchInput");
      const overlay = document.getElementById("overlay");
      const sheet = document.getElementById("sheet");

      function formatRupiah(num) {
        return "Rp " + Number(num).toLocaleString("id-ID");
      }

      function renderSkeleton() {
        gridEl.innerHTML = Array.from({ length: 6 })
          .map(
            () => `
    <div class="card skel-card">
      <div class="imgwrap skel"></div>
      <div class="info">
        <div class="skel" style="height:14px;width:70%;border-radius:6px;"></div>
        <div class="skel" style="height:12px;width:40%;border-radius:6px;margin-top:8px;"></div>
      </div>
    </div>`,
          )
          .join("");
      }

      function renderPills() {
        const options = ["Semua", ...categories.map((c) => c.nama)];
        pillRowEl.innerHTML = options
          .map(
            (cat) => `
    <div class="pill ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${cat}</div>
  `,
          )
          .join("");
        pillRowEl.querySelectorAll(".pill").forEach((el) => {
          el.addEventListener("click", () => {
            activeCategory = el.dataset.cat;
            renderPills();
            renderGrid();
          });
        });
      }

      function getFiltered() {
        return allProducts.filter((p) => {
          const matchCat =
            activeCategory === "Semua" || p.kategori?.nama === activeCategory;
          const matchQuery = p.nama
            .toLowerCase()
            .includes(searchQuery.toLowerCase());
          return matchCat && matchQuery;
        });
      }

      function renderGrid() {
        const items = getFiltered();

        if (items.length === 0) {
          gridEl.innerHTML = `
      <div class="state-msg">
        <h3>Menu Tidak Ditemukan</h3>
        <p>Coba kata kunci atau kategori lain</p>
      </div>`;
          return;
        }

        gridEl.innerHTML = items
          .map(
            (p) => `
    <div class="card" tabindex="0" data-id="${p.id}">
      <div class="imgwrap">
        <img src="${p.gambar_url || ""}" alt="${p.nama}" loading="lazy" onerror="this.style.opacity=0">
      </div>
      <div class="info">
        <h3>${p.nama}</h3>
        <div class="meta-row">
          <span class="badge">${p.kategori?.nama || "Menu"}</span>
          <span class="price">${formatRupiah(p.harga)}</span>
        </div>
      </div>
    </div>
  `,
          )
          .join("");

        gridEl.querySelectorAll(".card").forEach((card) => {
          const open = () => openDetail(Number(card.dataset.id));
          card.addEventListener("click", open);
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter") open();
          });
        });
      }

      function openDetail(id) {
        const p = allProducts.find((x) => x.id === id);
        if (!p) return;

        sheet.innerHTML = `
    <div class="sheet-imgbox">
      <div class="grabber"></div>
      <button class="closebtn" id="closeBtn" aria-label="Tutup">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <div class="hero"><img src="${p.gambar_url || ""}" alt="${p.nama}" onerror="this.style.opacity=0"></div>
    </div>
    <div class="body">
      <span class="tag">${p.kategori?.nama || "Menu"}</span>
      <h2>${p.nama}</h2>
      <div class="price">${formatRupiah(p.harga)}</div>
      <div class="desc ${p.deskripsi ? "" : "empty"}">${p.deskripsi || "Belum ada deskripsi untuk menu ini."}</div>
    </div>
  `;
        overlay.classList.add("show");
        document.body.style.overflow = "hidden";
        document
          .getElementById("closeBtn")
          .addEventListener("click", closeDetail);
      }

      function closeDetail() {
        overlay.classList.remove("show");
        document.body.style.overflow = "";
      }
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeDetail();
      });

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        renderGrid();
      });

      async function loadData() {
        renderSkeleton();
        try {
          const [
            { data: kategoriData, error: kErr },
            { data: produkData, error: pErr },
          ] = await Promise.all([
            supa.from("kategori").select("*").order("nama"),
            supa
              .from("produk")
              .select(
                "id, kategori_id, nama, harga, deskripsi, gambar_url, kategori:kategori_id(nama)",
              )
              .order("id", { ascending: false }),
          ]);
          if (kErr) throw kErr;
          if (pErr) throw pErr;

          categories = kategoriData || [];
          allProducts = produkData || [];

          renderPills();
          renderGrid();
        } catch (err) {
          console.error(err);
          gridEl.innerHTML = `
      <div class="state-msg">
        <h3>Gagal memuat menu</h3>
        <p>Periksa koneksi internet atau coba lagi nanti.</p>
      </div>`;
        }
      }

      loadData();
    </script>
  </body>
</html>
